<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savage Rifts — Power Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0d0f;
    --surface:  #141418;
    --border:   #2a2a32;
    --accent:   #c0392b;
    --accent2:  #e67e22;
    --gold:     #d4a843;
    --text:     #e8e4dc;
    --muted:    #7a7570;
    --panel:    #1a1a20;
    --hover:    #1e1e26;
    --tag-bg:   #1f1f28;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 16px;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(192,57,43,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 90%, rgba(212,168,67,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 24px 60px; display: flex; gap: 24px; align-items: flex-start; }

  .app { flex: 1; min-width: 0; }

  /* Sidebar */
  .sidebar {
    position: sticky;
    top: 24px;
    width: 260px;
    flex-shrink: 0;
    padding-top: 120px;
  }

  .sidebar-inner {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .sidebar-header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 12px 16px;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar-header:hover { color: var(--text); }
  .sidebar-toggle { font-size: 14px; color: var(--muted); transition: transform 0.2s; }
  .sidebar.collapsed .sidebar-toggle { transform: rotate(-90deg); }
  .sidebar.collapsed .sidebar-body { display: none; }

  .sidebar-body {
    padding: 14px 16px;
    max-height: calc(100vh - 160px);
    overflow-y: auto;
  }

  .sidebar-body::-webkit-scrollbar { width: 4px; }
  .sidebar-body::-webkit-scrollbar-track { background: transparent; }
  .sidebar-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .common-mod {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.6;
  }

  .common-mod:last-child { border-bottom: none; padding-bottom: 0; }
  .common-mod:first-child { padding-top: 0; }

  .mod-name {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }

  .mod-cost {
    display: inline-block;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 4px;
    font-family: 'Cinzel', serif;
  }

  .common-mod p { font-size: 13px; color: var(--muted); margin: 0; }

  header {
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  header p {
    margin-top: 6px;
    color: var(--muted);
    font-style: italic;
    font-size: 15px;
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    padding: 10px 16px 10px 38px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }

  .search-wrap::before {
    content: '⌕';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 18px;
    pointer-events: none;
  }

  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  select:focus { border-color: var(--accent); }

  .count {
    color: var(--muted);
    font-style: italic;
    font-size: 14px;
    margin-left: auto;
    white-space: nowrap;
    align-self: center;
  }

  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; }

  thead tr {
    background: var(--panel);
    border-bottom: 2px solid var(--accent);
  }

  th {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  th:hover { color: var(--text); }
  th.sorted { color: var(--accent2); }
  th .sort-arrow { margin-left: 4px; opacity: 0.5; font-size: 10px; }
  th.sorted .sort-arrow { opacity: 1; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.expanded { background: var(--hover); }

  td { padding: 12px 16px; font-size: 15px; vertical-align: middle; }
  /* td.name moved to pin section */
  td.name .has-desc { color: var(--gold); }

  .rank-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 12px;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .rank-Novice    { background: #1a2a1a; color: #5a9a5a; border: 1px solid #2a4a2a; }
  .rank-Seasoned  { background: #1a1e2a; color: #5a7abf; border: 1px solid #2a3a5a; }
  .rank-Veteran   { background: #2a1a2a; color: #9a5abf; border: 1px solid #4a2a5a; }
  .rank-Heroic    { background: #2a1a1a; color: #c07a3a; border: 1px solid #5a3a1a; }
  .rank-Legendary { background: #2a2010; color: var(--gold); border: 1px solid #5a4a20; }

  tr.detail-row td {
    padding: 0;
    border-bottom: 2px solid var(--accent);
  }

  .detail-panel {
    background: var(--panel);
    padding: 24px 28px;
    animation: slideDown 0.2s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .detail-header h2 {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    color: var(--text);
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .detail-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .stat-chip {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 12px;
    font-size: 13px;
    color: var(--muted);
  }

  .stat-chip strong { color: var(--text); font-weight: 600; }

  .detail-body {
    font-size: 15px;
    line-height: 1.75;
    color: #ccc8c0;
    border-left: 2px solid var(--accent);
    padding-left: 16px;
  }

  .detail-body h3 {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    margin: 14px 0 6px;
  }

  .detail-body h3:first-child { margin-top: 0; }
  .detail-body p { margin-bottom: 10px; }
  .detail-body p:last-child { margin-bottom: 0; }
  .detail-body b, .detail-body strong { color: var(--text); font-weight: 600; }
  .detail-body i, .detail-body em { color: #bbb8b0; font-style: italic; }
  .detail-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .detail-body ul, .detail-body ol { padding-left: 20px; margin-bottom: 10px; }
  .detail-body li { margin-bottom: 4px; }

  .no-desc { color: var(--muted); font-style: italic; }
	
  .disclaimer-banner {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #1a1208;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 19px;
    color: #c8a060;
    font-style: italic;
    letter-spacing: 0.3px;
    border-bottom: 2px solid var(--accent2);
    box-shadow: 0 0 8px rgba(230,126,34,0.3), 0 0 0 2px rgba(230,126,34,0.15);
    animation: banner-pulse 2.5s ease-in-out infinite;
  }
  @keyframes banner-pulse {
    0%   { border-color: #e67e22; box-shadow: 0 0 6px rgba(230,126,34,0.2), inset 0 0 0 0 rgba(230,126,34,0); }
    50%  { border-color: #f39c12; box-shadow: 0 0 18px rgba(243,156,18,0.6), inset 0 -1px 0 0 rgba(243,156,18,0.15); }
    100% { border-color: #e67e22; box-shadow: 0 0 6px rgba(230,126,34,0.2), inset 0 0 0 0 rgba(230,126,34,0); }
  }
  .disclaimer-banner .banner-icon { font-style: normal; font-size: 28px; flex-shrink: 0; display: none; animation: icon-bounce 2.5s ease-in-out infinite; }
  @keyframes icon-bounce {
    0%, 100% { transform: translateY(-2px); }
    50%       { transform: translateY(2px); }
  }
  .disclaimer-banner .banner-text { flex: 1; text-align: center; }
  .disclaimer-banner .banner-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    flex-shrink: 0;
    font-style: normal;
    transition: color 0.15s;
  }
  .disclaimer-banner .banner-close:hover { color: var(--text); }	

  .state-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-style: italic;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
	
.drawer-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 200;
  }
  .drawer-overlay.open { display: block; }

  #mobile-filter-btn {
    display: none;
    align-items: center; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Cinzel', serif;
    font-size: 12px; letter-spacing: 1px;
    padding: 8px 14px; border-radius: 4px;
    cursor: pointer; flex-shrink: 0;
  }

  .drawer-close {
    display: none;
    position: fixed;
    top: 12px;
    left: 320px;
    width: 32px; height: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--rift); /* var(--accent) for powers */
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    z-index: 401;
  }

  @media (max-width: 768px) {
    #mobile-filter-btn { display: flex; }
    .sidebar {
      position: fixed !important;
      top: 0; left: -110% !important;
      width: 80% !important; max-width: 320px;
      height: 100dvh;
      z-index: 400;
      padding-top: 0 !important;
      overflow-y: auto;
      transition: left 0.25s ease;
      background: var(--bg2, #3a4048);
    }
	
    .sidebar.drawer-open { left: 0 !important; }
    .sidebar-body {
      max-height: calc(100dvh - 48px);
      padding-bottom: 0;
    }
    .drawer-close { display: none; }
    .page-wrap {
      flex-direction: column !important;
      padding: 0 12px 40px !important;
      gap: 0 !important;
    }
    .controls {
      flex-direction: column !important;
      gap: 8px !important;
    }
    .controls select { width: 100% !important; }
    .search-wrap { width: 100% !important; }
    th:not(:first-child),
    td:not(:first-child) { display: none !important; }
    th:first-child, td:first-child {
      width: 100% !important;
      padding: 10px 12px !important;
    }
    .detail-row td { padding: 12px !important; }
    .detail-stats { flex-direction: column !important; gap: 6px !important; }
    h1 { font-size: 22px !important; }
    .subtitle { font-size: 12px !important; }
  }
	

  /* ── Pinned / Starred powers ─────────────────────────────── */
  .pin-btn {
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: var(--muted, #7a7570);
    padding: 0 6px 0 0; line-height: 1;
    transition: color 0.15s, transform 0.15s;
    flex-shrink: 0;
  }
  .pin-btn:hover { color: #f0c040; transform: scale(1.2); }
  .pin-btn.pinned { color: #f0c040; }
  td.name { font-weight: 600; display: flex; align-items: center; gap: 2px; }
  tbody tr.pinned-row {
    background: rgba(240, 192, 64, 0.08) !important;
    border-left: 3px solid #f0c040;
  }
  tbody tr.pinned-row:hover { background: rgba(240, 192, 64, 0.14) !important; }
</style>
</head>
<body>

<div id="disclaimer-banner" class="disclaimer-banner">
  <span class="banner-icon">⚠</span>
  <span class="banner-text"><span style="font-size:28px; font-style:normal; display:inline-block; margin-right:10px; animation: icon-bounce 2.5s ease-in-out infinite;">⚠</span>This reference sheet covers the core Savage Rifts powers and modifiers only. Power modifiers granted by Edges or Frameworks are not included!</span>
  <button class="banner-close" onclick="document.getElementById('disclaimer-banner').style.display='none'" title="Dismiss">✕</button>
</div>
	
<div class="page-wrap">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-header" onclick="toggleSidebar()">
      Common Modifiers <span class="sidebar-toggle" id="sidebarToggle">▾</span>
    </div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </div>
</aside>

<div class="app">
  <header>
    <h1>Savage <span>Rifts</span> — Power Reference</h1>
    <p>Click any row to expand full description</p>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search powers...">
    </div>
    <select id="rankFilter">
      <option value="">All Ranks</option>
      <option>Novice</option>
      <option>Seasoned</option>
      <option>Veteran</option>
      <option>Heroic</option>
      <option>Legendary</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-col="name">Power Name <span class="sort-arrow">↕</span></th>
          <th data-col="cost">Cost <span class="sort-arrow">↕</span></th>
          <th data-col="rank">Rank <span class="sort-arrow">↕</span></th>
          <th data-col="range">Range <span class="sort-arrow">↕</span></th>
          <th data-col="duration">Duration <span class="sort-arrow">↕</span></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div><!-- app -->
</div><!-- page-wrap -->

<script>

// =============================================================
//  COMMON MODIFIERS
//  These appear in the sticky sidebar on the left.
//  Add or edit entries the same way as powers.
// =============================================================

const COMMON_MODIFIERS = [
  {
    name: "Armor Piercing (+1 to +3)",
    cost: "+1 to +3 PP",
    desc: "The attack is focused to defeat armor or seeks out exposed areas. Each Power Point spent grants it AP 2 to a maximum of AP 6."
  },
  {
    name: "Fatigue (+2)",
    cost: "+2 PP",
    desc: "Powers that drain or tax an opponent can cause Fatigue. This modifier may be attached to any power that can cause damage or is resisted by the target. If she\'s affected by the power in any way, she also suffers Fatigue. This cannot cause Incapacitation, however."
  },
  {
    name: "Glow/Shroud (+1)",
    cost: "+1 PP",
    desc: "Glow gives off soft light of an appropriate color for its Trapping (or caster\'s choice). This creates soft light in a Small Blast Template centered on the target, and lasts until the power expires. It subtracts 2 from her Stealth totals and negates 1 point of Illumination penalties for those attacking the glowing character.\n\nShroud dims and slightly obscures the target so that attacks against her suffer a −1 penalty and she adds +1 to her Stealth rolls."
  },
  {
    name: "Heavy Weapon (+2)",
    cost: "+2 PP",
    desc: "The caster pours his energy into the attack, creating a focused blast. The attack deals Mega Damage (counts as a Heavy Weapon)."
  },
  {
    name: "Hinder/Hurry (+1)",
    cost: "+1 PP",
    desc: "The target is slowed in some way, perhaps due to intense cold, a slippery surface, or even binding matter or energy. His base Pace is reduced by 2 until the power expires.\n\nA caster can Hurry the recipient instead. He might get increased energy, sure footing, or more powerful muscles. His Pace is increased by 2.\n\nEffects of either modifier aren\'t cumulative."
  },
  {
    name: "Lingering Damage (+2)",
    cost: "+2 PP",
    desc: "The target is hit by fire, intense cold, acid, gnawing insects, or some other Trapping that continues to cause damage after the initial attack. On the victim\'s next turn, he suffers the power\'s base damage minus one die type (one additional turn only). If hit with a 2d6 bolt, for example, the victim takes 2d4 damage at the start of his next turn. If the base damage is already a d4 die type, it loses a die instead."
  },
  {
    name: "Range (+1/+2)",
    cost: "+1/+2 PP",
    desc: "Double the power\'s listed Range for 1 Power Point, or triple it for +2. Casters with access to Mega Modifiers can increase Range to 5× for +3 Power Points or 10× for +4. This modifier may not be used on powers with a Range of Touch or the Cone Template."
  },
  {
    name: "Selective (+1)",
    cost: "+1 PP",
    desc: "With intense focus, the caster can choose not to affect any or all individual targets within a power\'s area of effect (picking all enemies instead of allies in a blast, for example)."
  },
  // ── ADD MORE COMMON MODIFIERS BELOW ──────────────────────────
];

function renderSidebar() {
  const body = document.getElementById('sidebarBody');
  body.innerHTML = COMMON_MODIFIERS.map(m => `
    <div class="common-mod">
      <div class="mod-name">${m.name}</div>
      <span class="mod-cost">${m.cost}</span>
      <p>${m.desc.replace(/\\n\\n/g, "<br><br>")}</p>
    </div>
  `).join('');
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  document.getElementById('sidebarToggle').textContent = 
    sidebar.classList.contains('collapsed') ? '▸' : '▾';
}

// =============================================================
//  POWER DATA
//  To add a power, copy one of the blocks below and fill it in.
//
//  Description supports HTML formatting:
//    <h3>Section Title</h3>
//    <p>Paragraph text</p>
//    <b>bold</b>   <i>italic</i>   <hr> for a divider line
//    <ul><li>bullet item</li></ul>
//
//  Rank options: Novice, Seasoned, Veteran, Heroic, Legendary
// =============================================================

const POWERS = [

  {
    name:     "Arcane Protection",
    cost:     "1",
    rank:     "Novice",
    range:    "Smarts",
    duration: "5 Rounds",
    description: `
      <h3>Trappings</h3>
	<p>Concentration, a dull glow around the protected character, a fetish.</p>
      <h3>Summary</h3>
      <p>Success with arcane protection means hostile powers suffer a −2 penalty (−4 with a raise) to affect this character. If the hostile power fails to affect the target due to this penalty, it still activates and consumes Power Point (and may still affect other targets). If the power causes harm, damage is also reduced a like amount for the protected target. Arcane protection stacks with the Arcane Resistance Edge..</p>
      <h3>MODIFIERS</h3>
      <p><b>ADDITIONAL RECIPIENTS (+1):</b> The power may affect more than one target for 1 additional Power Point each. Cannot be combined with any Mega Modifier.</p>
      <h3>MEGA MODIFIERS</h3>
      <p><b>GREATER ARCANE PROTECTION (+2):</b> Hostile powers suffer a −4 penalty (–6 with a raise).</p>
    `
  },

  {
    name:     "Beast Friend",
    cost:     "Special",
    rank:     "Novice",
    range:    "Smarts",
    duration: "10 Minutes",
    description: `
	      <h3>Trappings</h3>
		  <p>The caster concentrates and gestures with his hands.</p>
		  <h3>Summary</h3>
		  <p>This spell allows an individual to speak with and guide the actions of nature’s beasts. The cost to cast is equal to the sum of their Size (minimum 1 per creature; see the creatures in Savage Worlds for examples). Controlling five wolves (Size −1) costs 5 points (remember the minimum cost of 1), for example. Controlling a rhino (Size 5) costs 5 points.</p>
		  <p>Success means the creatures obey simple commands, like a well-trained dog. They attack foes and endanger their lives for their master. A raise on the arcane skill roll means the beasts are more obedient. They won’t kill themselves but overcome their natural fears to follow their orders.</p>
		  <p>Swarms can also be controlled. Small Swarms cost 1 point, Medium Swarms cost 2, and Large Swarms cost 3.</p>
		  <p>Beast friend works only on natural creatures with animal intelligence, not humanoids, and has no effect on conjured, magical, or otherwise “unnatural” animals.</p>

let sortCol = 'name', sortAsc = true, expandedRow = null;
const rankOrder = { Novice:1, Seasoned:2, Veteran:3, Heroic:4, Legendary:5 };

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const rank = document.getElementById('rankFilter').value;
  return POWERS.filter(p =>
    (!q || p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)) &&
    (!rank || p.rank === rank)
  );
}

const pinned = new Set();

function render() {
  const sorted = [...getFiltered()].sort((a, b) => {
    if (sortCol === 'rank') {
      const av = rankOrder[a.rank] || 99, bv = rankOrder[b.rank] || 99;
      return sortAsc ? av - bv : bv - av;
    }
    if (sortCol === 'cost') {
      const an = parseFloat(a.cost), bn = parseFloat(b.cost);
      if (!isNaN(an) && !isNaN(bn)) return sortAsc ? an - bn : bn - an;
    }
    const av = a[sortCol] || '', bv = b[sortCol] || '';
    return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
  });

  document.querySelectorAll('th[data-col]').forEach(th => {
    const col = th.dataset.col;
    th.classList.toggle('sorted', col === sortCol);
    th.querySelector('.sort-arrow').textContent = col === sortCol ? (sortAsc ? '↑' : '↓') : '↕';
  });

  document.getElementById('count').textContent = `${sorted.length} power${sorted.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('tableBody');
  expandedRow = null;

  if (!sorted.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="state-msg">No powers match your search.</td></tr>';
    return;
  }

  const pinnedData = sorted.filter(p => pinned.has(p.name));
  const unpinned   = sorted.filter(p => !pinned.has(p.name));
  const ordered    = [...pinnedData, ...unpinned];

  tbody.innerHTML = '';
  ordered.forEach(p => {
    const isPinned = pinned.has(p.name);
    const tr = document.createElement('tr');
    if (isPinned) tr.classList.add('pinned-row');
    tr.innerHTML = `
      <td class="name">
        <button class="pin-btn ${isPinned ? 'pinned' : ''}" data-name="${p.name}" title="Pin to top">★</button>
        <span class="${p.description.trim() ? 'has-desc' : ''}">${p.name}</span>
      </td>
      <td>${p.cost}</td>
      <td><span class="rank-badge rank-${p.rank}">${p.rank}</span></td>
      <td>${p.range}</td>
      <td>${p.duration}</td>
    `;
    tr.querySelector('.pin-btn').addEventListener('click', ev => {
      ev.stopPropagation();
      const name = ev.currentTarget.dataset.name;
      if (pinned.has(name)) pinned.delete(name);
      else pinned.add(name);
      render();
    });
    tr.addEventListener('click', () => toggleDetail(tr, p));
    tbody.appendChild(tr);
  });
}

function toggleDetail(tr, p) {
  const existing = document.querySelector('tr.detail-row');
  if (existing) {
    existing.remove();
    document.querySelectorAll('tbody tr').forEach(r => r.classList.remove('expanded'));
    if (expandedRow === tr) { expandedRow = null; return; }
  }
  expandedRow = tr;
  tr.classList.add('expanded');
  const dt = document.createElement('tr');
  dt.className = 'detail-row';
  dt.innerHTML = `
    <td colspan="5">
      <div class="detail-panel">
        <div class="detail-header"><h2>${p.name}</h2></div>
        <div class="detail-stats">
          <div class="stat-chip">Cost: <strong>${p.cost}</strong></div>
          <div class="stat-chip">Rank: <strong>${p.rank}</strong></div>
          <div class="stat-chip">Range: <strong>${p.range}</strong></div>
          <div class="stat-chip">Duration: <strong>${p.duration}</strong></div>
        </div>
        <div class="detail-body">
          ${p.description.trim() || '<span class="no-desc">No description entered yet.</span>'}
        </div>
      </div>
    </td>
  `;
  tr.after(dt);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('rankFilter').addEventListener('change', render);
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    render();
  });
});

render();
renderSidebar();
	
	(function() {
  const sidebar = document.querySelector('.sidebar');
  if (!sidebar) return;

  const overlay = document.createElement('div');
  overlay.className = 'drawer-overlay';
  document.body.appendChild(overlay);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'drawer-close';
  closeBtn.innerHTML = '✕';
  sidebar.insertBefore(closeBtn, sidebar.firstChild);

  const filterBtn = document.createElement('button');
  filterBtn.id = 'mobile-filter-btn';
  filterBtn.innerHTML = '&#9776; Common Power Modifiers';
  const controls = document.querySelector('.controls');
  if (controls) controls.insertBefore(filterBtn, controls.firstChild);

  function openDrawer() {
    sidebar.classList.add('drawer-open');
    closeBtn.style.display = 'block';
    document.body.style.overflow = 'hidden';
    // auto-close warning banner
    const banner = document.querySelector('.disclaimer-banner');
    if (banner) banner.style.display = 'none';
  }
  function closeDrawer() {
    sidebar.classList.remove('drawer-open');
    closeBtn.style.display = 'none';
    document.body.style.overflow = '';
  }

  filterBtn.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);
})();
